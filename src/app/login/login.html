<div class="min-h-screen flex flex-col items-center justify-center bg-gray-50">
  <form
    (ngSubmit)="login()"
    class="bg-white p-8 rounded-xl shadow-md w-full max-w-sm"
  >
    <h2 class="text-3xl font-bold text-gray-800 mb-8 text-center">Login</h2>
    <div class="mb-6">
      <label for="username" class="block text-gray-700 font-semibold mb-2"
        >Username</label
      >
      <input
        #usernameInput="ngModel"
        [(ngModel)]="username"
        id="username"
        name="username"
        type="text"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
        placeholder="Enter your username"
        required
      />
    </div>
    <div class="mb-6">
      <label for="password" class="block text-gray-700 font-semibold mb-2"
        >Password</label
      >
      <input
        #passwordInput="ngModel"
        [(ngModel)]="password"
        id="password"
        name="password"
        type="password"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
        placeholder="Enter your password"
        required
      />
    </div>
    <button
      type="submit"
      class="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 rounded-lg transition"
    >
      Login
    </button>

    @if(message()){
    <p class="mt-3">{{ message() }}</p>
    }
  </form>
  <p class="mt-4">
    Not a user yet?
    <a
      class="text-blue-600 hover:text-blue-800 underline"
      routerLink="/register"
      >Register Here</a
    >
  </p>
</div>
